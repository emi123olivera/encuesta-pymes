<script>
"use strict";
/* =====================================================================
   CONFIGURACIÓN — llena estos valores (ver GUIA.md, sección G).
   Aquí SOLO van valores públicos. La clave publicable (sb_publishable_...)
   está hecha para estar en el navegador. NUNCA pongas aquí la clave secreta
   (sb_secret_...) ni la service_role.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://guffiusipdondqssczup.supabase.co",               // ej.: https://abcdefghijkl.supabase.co
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_RSZDB55Jj_LqtWf9nvbNYQ_QkzQM7ho",   // ej.: sb_publishable_xxxxxxxxxxxxxxxx
  FUNCTION_NAME: "submit-response",
  PUBLIC_URL: "https://emi123olivera.github.io/encuesta-pymes/",                 // ej.: https://tu-usuario.github.io/encuesta-pymes/
  INVESTIGADOR: "Emilio Alexander Olivera Portillo",               // opcional: nombre del investigador responsable
  INSTITUCION: "INLUSA",                // opcional: escuela o institución
  CONTACTO: "emi3103olivera@gmail.com",                   // opcional: correo u otro medio para dudas
  CONSERVACION: "",               // opcional: cuánto tiempo se guardarán los datos y qué pasa después
  POLL_SECONDS: 60                // actualización periódica del panel (no es tiempo real)
};

/* Bibliotecas externas: versión fija + integridad (SRI). Solo se cargan en el
   panel; el cuestionario funciona sin ellas. */
const LIBS = {
  supabase: { src: "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js",
              integrity: "sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" },
  qrcode:   { src: "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js",

};

/* =====================================================================
   INSTRUMENTO — texto literal del cuestionario. Debe coincidir EXACTAMENTE
   con encuesta.questions/options del SQL; la página compara su huella con
   la del servidor y bloquea el envío si son distintas.
   o(código, etiqueta, banderas) -> banderas: O = abre "Otro", X = excluyente,
   N = "No sé", 1 = suma un punto de control.
   ===================================================================== */
function o(code, label, flags) {
  flags = flags || "";
  return { code: code, label: label, other: flags.includes("O"), exclusive: flags.includes("X"),
           nosabe: flags.includes("N"), points: flags.includes("1") ? 1 : 0 };
}
const INSTRUMENT = {
  survey_id: "inventario-pymes-2026",
  instrument_version: "v1",
  consent_version: "c1-confidencial",
  title: "Encuesta sobre el manejo del inventario y los resultados económicos en pequeñas y medianas empresas (PYMES)",
  blocks: [
    { n: 1, title: "Sobre el negocio", qs: ["p1", "p2", "p3"] },

function el(tag, attrs) {
  const node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
      else if (v === true) node.setAttribute(k, "");
      else node.setAttribute(k, String(v));
    });
  }
  for (let i = 2; i < arguments.length; i++) append(node, arguments[i]);
  return node;
}
function append(node, child) {

  if (Array.isArray(child)) { child.forEach(function (c) { append(node, c); }); return; }
  node.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);

}

function loadLib(name) {

   ===================================================================== */
async function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(function () { ctrl.abort(); }, ms || 20000);
  try { return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal, credentials: "omit", cache: "no-store" })); }
  finally { clearTimeout(t); }
}

    if (r.status === 403 && d && d.status === "forbidden_origin") return { kind: "origin" };
    if (!r.ok || !d || d.status !== "ok") return { kind: "server", http: r.status };

    if (r.status === 422 || r.status === 400 || r.status === 413 || r.status === 415) return { kind: "invalid", errors: (d && d.errors) || [] };

    if (r.status === 409) return { kind: "conflict" };

function demoValidate(p) {
  const errs = [];
  if (!p || typeof p !== "object") return ["payload"];
  if (p.instrument_version !== INSTRUMENT.instrument_version) errs.push("instrument_version");
  if (!p.consent || p.consent.given !== true || p.consent.version !== INSTRUMENT.consent_version) errs.push("consent");
  const pa = p.participant || {};
  if (nameError(pa.nombres, "nombre")) errs.push("nombres");
  if (nameError(pa.apellidos, "apellidos")) errs.push("apellidos");
  if (typeof pa.edad !== "number" || ageError(String(pa.edad))) errs.push("edad");
  const a = p.answers || {};
  INSTRUMENT.questions.forEach(function (q) {
    if (q.kind === "single") {
      const op = q.options.find(function (x) { return x.code === a[q.code]; });
      if (!op) { errs.push(q.code); return; }
      const hasOther = q.options.some(function (x) { return x.other; });
      if (hasOther) {
        const t = a[q.code + "_otro"];
        if (op.other && (typeof t !== "string" || !normName(t) || normName(t).length > 120)) errs.push(q.code + "_otro");
        if (!op.other && t !== undefined && t !== null) errs.push(q.code + "_otro_sin_opcion");
      }
    } else {
      const arr = a[q.code];
      if (!Array.isArray(arr) || !arr.length) { errs.push(q.code); return; }
      if (new Set(arr).size !== arr.length) errs.push(q.code + "_repetida");
      if (arr.some(function (c) { return !q.options.some(function (x) { return x.code === c; }); })) errs.push(q.code);
      const ex = arr.filter(function (c) { return q.options.find(function (x) { return x.code === c && x.exclusive; }); });

function demoSeed(n) {

    const ops = Q[qc].options; const w = weights || ops.map(function () { return 1; });
    const tot = w.reduce(function (a, b) { return a + b; }, 0); let x = rnd() * tot;
    for (let i = 0; i < ops.length; i++) { x -= w[i]; if (x <= 0) return ops[i].code; }
    return ops[ops.length - 1].code;
  }
  const fict = ["Ana", "Luis", "María José", "Juan Pablo", "Sofía", "Diego", "Valeria", "Óscar"];
  for (let i = 0; i < n; i++) {
    const a = {
      p1: pick("p1", [5, 3, 3, 1]), p2: pick("p2", [5, 3, 2, 1]), p3: pick("p3", [3, 5, 3, 2, 1, 1]),
      p4: pick("p4", [2, 4, 4, 3, 1, 1]), p5: pick("p5", [3, 3, 3, 1, 1, 1]), p6: pick("p6", [2, 4, 3, 2, 1, 1]),

    if (a.p2 === "otro") a.p2_otro = "Puesto ficticio";
    if (a.p4 === "otra") a.p4_otro = "Herramienta ficticia";
    if (a.p7 === "otro") a.p7_otro = "Criterio ficticio";
    const r = rnd();

  renderSurvey(); announce("Enviando sus respuestas");
  let res;
  try { res = await SurveyApi.submit(payloadFromState()); }
  catch (e) { res = { kind: "uncertain" }; }
  sending = false;
  if (res.kind === "ok" || res.kind === "duplicate") {
    S.result = { folio: res.folio, received_at: res.received_at };
    S.pendingUncertain = false;

async function checkStatus() {
  if (DEMO) { serverStatus = await DemoSurveyApi.status(); if (S.step === 0) renderSurvey(); return; }
  if (/^sb_secret_/.test(CONFIG.SUPABASE_PUBLISHABLE_KEY) || /^sb_secret_/.test(CONFIG.SUPABASE_URL)) { serverStatus = { kind: "secret" }; renderSurvey(); return; }
  if (!configured()) { serverStatus = { kind: "config" }; renderSurvey(); return; }
  serverStatus = { kind: "loading" }; if (S.step === 0) renderSurvey();
  const st = await RealSurveyApi.status();
  if (st.kind === "ok") {
    if (!localHash) { try { localHash = await sha256hex(instrumentString()); } catch (e) { localHash = "sin-https"; } }
    st.mismatch = st.instrument_hash !== localHash || st.instrument_version !== INSTRUMENT.instrument_version || st.consent_version !== INSTRUMENT.consent_version;
  }
  serverStatus = st;
  if (S.step === 0 || S.step === 6) renderSurvey();

/* =====================================================================
   PANEL PRIVADO (#/panel)
   La protección real está en el servidor: sesión de Supabase Auth + lista

   decide quién es administrador; solo muestra lo que el servidor entrega.

const AdminApi = DEMO ? DemoAdminApi : RealAdminApi;
const PAGE_SIZE_SERVER = 500;

           loading: false, error: "", printing: false, pollTimer: null };

/* ---------- Datos ---------- */
function filteredRows() {
  const f = P.filters;
  return P.rows.filter(function (r) {
    if (f.estado === "incluidas" && r.excluded) return false;
    if (f.estado === "excluidas" && !r.excluded) return false;
    const day = localDay(r.received_at);
    if (f.from && day < f.from) return false;
    if (f.to && day > f.to) return false;
    if (f.p1 && r.p1 !== f.p1) return false;
    if (f.p2 && r.p2 !== f.p2) return false;
    if (f.p3 && r.p3 !== f.p3) return false;
    if (f.cls && r.classification !== f.cls) return false;
    if (f.level && r.control_level !== f.level) return false;
    return true;
  });
}
async function refreshData(opts) {
  if (P.loading) { P.again = true; return; } // se repite al terminar la carga en curso
  P.loading = true; P.again = false; P.error = "";
  setUpdateText("Actualizando…");
  try {
    const cfg = await AdminApi.getConfig();
    const rows = [];
    for (let offset = 0; ; offset += PAGE_SIZE_SERVER) {
      const page = await AdminApi.list(PAGE_SIZE_SERVER, offset);
      if (!Array.isArray(page)) throw new Error("Respuesta inesperada del servidor");
      Array.prototype.push.apply(rows, page);
      if (page.length < PAGE_SIZE_SERVER) break;
    }
    if (rows.length < cfg.total_responses) throw new Error("La carga quedó incompleta (" + rows.length + " de " + cfg.total_responses + "). Vuelva a actualizar.");
    const sig = JSON.stringify(rows) + "|" + cfg.is_open;
    const changed = sig !== P.sig;
    P.rows = rows; P.cfg = cfg; P.sig = sig; P.loadedAt = new Date();
    if (changed || (opts && opts.force)) renderPanelBody(); else setUpdateText();
  } catch (e) {
    if (e && e.unauthorized) { await logout("Su sesión ya no tiene permiso para ver el panel."); return; }
    P.error = (e && e.message) || "Error al cargar los datos";
    renderPanelBody();
  } finally {
    P.loading = false; setUpdateText();
    if (P.again && P.authed) { P.again = false; refreshData({ force: true }); }
  }
}
function setUpdateText(t) {
  const n = document.getElementById("upd-text"); if (!n) return;
  n.textContent = t || (P.loadedAt ? "Última actualización: " + fmtTime.format(P.loadedAt) + " · se actualiza cada " + CONFIG.POLL_SECONDS + " s (periódico, no instantáneo)" : "");
}
function startPolling() {
  stopPolling();
  P.pollTimer = setInterval(function () { if (!document.hidden && P.authed && !P.printing) refreshData(); }, Math.max(15, CONFIG.POLL_SECONDS) * 1000);
}
function stopPolling() { if (P.pollTimer) clearInterval(P.pollTimer); P.pollTimer = null; }
async function logout(msg) {
  stopPolling(); closeDialog();
  P = freshPanel(); // elimina de la memoria los registros cargados
  clear(document.getElementById("app"));
  await AdminApi.signOut();
  renderPanel(msg || "Sesión cerrada. Los datos se borraron de esta pantalla.");
}

/* ---------- Estadística ---------- */
function freq(rows, qc) {
  const q = Q[qc];
  const counts = {}; q.options.forEach(function (x) { counts[x.code] = 0; });
  let n = 0;
  rows.forEach(function (r) {
    if (q.kind === "multi") { if (r.p12 && r.p12.length) { n++; r.p12.forEach(function (c) { if (c in counts) counts[c]++; }); } }
    else if (r[qc]) { n++; if (r[qc] in counts) counts[r[qc]]++; }
  });

function csvCell(v) {
  let s = v === null || v === undefined ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // evita que Excel lo interprete como fórmula
  return "\"" + s.replace(/"/g, "\"\"") + "\"";

function toCsv(rows) { return "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n"; }
function download(name, text) {

  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);

function analyticCsv(rows) {

  const head = ["id", "folio", "fecha_recepcion_utc", "encuesta", "version_instrumento", "version_consentimiento"];
  INSTRUMENT.questions.forEach(function (q) {
    if (q.kind === "multi") p12opts.forEach(function (op) { head.push("p12_" + op.code); });
    else { head.push(q.code); if (OTHER_QS.includes(q.code)) head.push(q.code + "_otro"); }
  });
  head.push("clasificacion_automatica", "clasificacion_efectiva", "clasificacion_revisada", "puntaje_control", "nivel_control", "no_se_p4_p9", "estado", "motivo_exclusion");
  const out = [head];
  rows.forEach(function (r) {
    const line = [r.id, r.folio, r.received_at, r.survey_id, r.instrument_version, r.consent_version];
    INSTRUMENT.questions.forEach(function (q) {
      if (q.kind === "multi") p12opts.forEach(function (op) { line.push((r.p12 || []).includes(op.code) ? "Sí" : "No"); });
      else { line.push(optLabel(q.code, r[q.code])); if (OTHER_QS.includes(q.code)) line.push(r[q.code + "_otro"] || ""); }
    });
    line.push(CLASS_LABELS[r.auto_classification], CLASS_LABELS[r.classification], r.classification_manual ? "Sí" : "No",
              r.control_score, r.control_level, r.nosabe_p4_p9, r.excluded ? "Excluida" : "Incluida", r.exclusion_reason || "");
    out.push(line);

function freqCsv(rows) {
  const out = [["pregunta", "numero", "texto_pregunta", "opcion_codigo", "opcion", "frecuencia", "denominador_n", "porcentaje", "nota"]];
  INSTRUMENT.questions.forEach(function (q) {
    const f = freq(rows, q.code);
    f.items.forEach(function (it) {
      const p = pct(it.count, f.n);
      out.push([q.code, q.num, q.prompt, it.code, it.label, it.count, f.n, p === null ? "" : p.toFixed(1), q.kind === "multi" ? "Opción múltiple: % de personas; puede sumar más de 100 %" : ""]);
    });
  });
  out.push([], ["nivel_control", "", "Nivel de control (P4–P9)", "", "", "", rows.length, "", "Puntaje 0–6"]);
  ["bajo", "medio", "alto"].forEach(function (l) { const c = rows.filter(function (r) { return r.control_level === l; }).length; const p = pct(c, rows.length); out.push(["nivel_control", "", "", l, LEVEL_LABELS[l], c, rows.length, p === null ? "" : p.toFixed(1), ""]); });
  return toCsv(out);
}
function crossCsv(rows) {
  const out = [["comparacion", "fila_variable", "fila", "n_fila", "columna_variable", "columna", "frecuencia", "porcentaje_fila"]];
  CROSSTABS.forEach(function (d) {
    const ct = crosstab(rows, d.row, d.col);
    ct.rows.forEach(function (r) { r.cells.forEach(function (c, i) {
      out.push([d.title, d.row, r.label, r.n, d.col, ct.colDim.options[i].label, c.count, c.pct === null ? "" : c.pct.toFixed(1)]);
    }); });
    if (d.margin) {

      ["p11", "p15"].forEach(function (qc) { const f = freq(sub, qc); f.items.forEach(function (it) {
        out.push(["Revisión de margen (ventas aumentaron; ganancias igual o menores)", "subconjunto", "P13=Aumentaron y P14=Igual/Disminuyeron", sub.length, qc, it.label, it.count, f.n ? (100 * it.count / f.n).toFixed(1) : ""]);
      }); });

}

  const linkCard = el("section", { class: "card" }, el("h3", { text: "Enlace para compartir" }));
  if (!CONFIG.PUBLIC_URL) {
    linkCard.appendChild(el("div", { class: "notice warn" }, el("strong", { text: "Pendiente" }), "Cuando publique la página, escriba su dirección en PUBLIC_URL (bloque CONFIG). Entonces aparecerán aquí el botón para copiar el enlace y el código QR."));
    append(linkCard, el("div", { class: "actions" }, el("button", { type: "button", class: "btn secondary small", disabled: true, text: "Copiar enlace" })));
  } else {
    const url = CONFIG.PUBLIC_URL;
    const inp = el("input", { type: "text", readonly: true, value: url, id: "pub-url", "aria-label": "Enlace público" });
    const copyMsg = el("span", { class: "muted small", role: "status" });
    const copy = el("button", { type: "button", class: "btn secondary small", text: "Copiar enlace" });
    copy.addEventListener("click", async function () {
      try { await navigator.clipboard.writeText(url); } catch (e) { inp.select(); try { document.execCommand("copy"); } catch (e2) { /* nada */ } }
      copyMsg.textContent = "Enlace copiado.";
    });
    const qrWrap = el("div", { class: "qr-box" }, el("p", { class: "muted small", text: "Generando código QR…" }));
    append(linkCard, [inp, el("div", { class: "actions" }, copy, copyMsg), qrWrap]);
    loadLib("qrcode").then(function () {
      clear(qrWrap);
      const qr = window.qrcode(0, "M"); qr.addData(url); qr.make();
      const n = qr.getModuleCount(), scale = 8, margin = 4, size = (n + margin * 2) * scale;
      const cv = el("canvas", { width: String(size), height: String(size), role: "img", "aria-label": "Código QR del enlace " + url, id: "qr-canvas" });
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size); ctx.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
      const dl = el("button", { type: "button", class: "btn secondary small", text: "Descargar QR (PNG)" });
      dl.addEventListener("click", function () { cv.toBlob(function (b) { const u = URL.createObjectURL(b); const a = el("a", { href: u, download: "qr-encuesta.png" }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); }); });
      append(qrWrap, [cv, el("div", {}, el("p", { class: "small", text: "Escanee para abrir la encuesta." }), dl)]);
    }).catch(function () { clear(qrWrap); qrWrap.appendChild(el("p", { class: "err", text: "No se pudo cargar el generador de QR (revise su conexión). El enlace sigue funcionando." })); });
  }
  panel.appendChild(linkCard);

  if (DEMO) {
    const failSel = el("select", { id: "demo-fail" },
      el("option", { value: "", text: "Sin fallas" }), el("option", { value: "after", text: "Próximo envío: se guarda pero se pierde la respuesta" }),
      el("option", { value: "before", text: "Próximo envío: falla antes de guardar" }));
    failSel.value = DemoDB.failNext || "";
    failSel.addEventListener("change", function () { DemoDB.failNext = failSel.value || null; });
    panel.appendChild(el("section", { class: "card", style: "border:2px dashed var(--warn)" }, el("h3", { text: "Herramientas del modo demostración" }),
      el("p", { class: "small", text: "Solo existen en ?modo=demo. Los datos son ficticios y desaparecen al cerrar la pestaña." }),
      el("div", { class: "actions" },
        el("button", { type: "button", class: "btn secondary small", id: "btn-seed", onclick: function () { demoSeed(40); refreshData({ force: true }); }, text: "Agregar 40 respuestas ficticias" }),
        el("button", { type: "button", class: "btn ghost small", onclick: function () { DemoDB.rows = []; DemoDB.people = {}; DemoDB.keys = {}; DemoDB.excl = []; DemoDB.over = []; refreshData({ force: true }); }, text: "Borrar datos demo" })),
      el("div", { class: "field", style: "margin-top:12px" }, el("label", { for: "demo-fail", text: "Simular falla de red" }), failSel)));
  }
}

/* =====================================================================
   ARRANQUE Y NAVEGACIÓN
   ===================================================================== */
document.getElementById("dlg-close").addEventListener("click", closeDialog);
document.getElementById("dlg").addEventListener("cancel", function (e) { e.preventDefault(); closeDialog(); });
document.getElementById("dlg").addEventListener("click", function (e) { if (e.target.id === "dlg") closeDialog(); });

function route() {
  closeDialog();
  if (location.hash === "#/panel") {
    document.title = "Panel del investigador · Encuesta PYMES";
    if (P.authed) { renderPanel(); startPolling(); return; }
    renderPanel();
    // ¿Ya hay una sesión en esta pestaña? El servidor decide si es administrador.
    if (!DEMO && configured()) {
      AdminApi.session().then(function (s) { if (s && !P.authed) afterAuth(); }).catch(function () { /* sin sesión */ });
    }
  } else {
    stopPolling();
    document.title = "Encuesta sobre inventario en PYMES";
    document.getElementById("brand-text").textContent = "Encuesta · Inventario en PYMES";
    clear(document.getElementById("header-extra"));
    document.getElementById("header-wrap").className = "wrap";
    renderSurvey();
  }
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && P.authed && location.hash === "#/panel" && P.loadedAt && (Date.now() - P.loadedAt.getTime()) > CONFIG.POLL_SECONDS * 1000) refreshData();
});

(function init() {
  if (DEMO) {
    document.getElementById("demo-banner").hidden = false;
    document.title = "[DEMO] " + document.title;
  }
  const foot = document.getElementById("footer-text");
  foot.textContent = "Encuesta confidencial con fines escolares" + (CONFIG.INSTITUCION ? " · " + CONFIG.INSTITUCION : "") + ". ";
  foot.appendChild(el("a", { href: "#/panel", text: "Acceso del investigador" }));
  sha256hex(instrumentString()).then(function (h) { localHash = h; }).catch(function () { /* contexto no seguro */ });
  route();
  checkStatus();
})();
</script>
</body>
